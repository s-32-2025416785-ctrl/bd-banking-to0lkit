<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Flashcards</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#16261d;--mute:#5d6e63;--line:#d9e2da;--accent:#0b6b4a;--accent-ink:#fff;--warm:#b4461f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a14;--card:#15241b;--ink:#e6efe8;--mute:#93a59a;--line:#264033;--accent:#3fbf8b;--accent-ink:#06150e;--warm:#f08a5d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
#card{width:100%;min-height:220px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#card .side{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
#card .term{font-size:1.8rem;font-weight:800;color:var(--accent)}
#card .def{font-size:1.1rem}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btns button{flex:1 1 auto;padding:12px;font:inherit;font-weight:700;border:0;border-radius:8px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btns button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.info{color:var(--mute);margin-top:14px;text-align:center}
</style>
</head>
<body>
<main>
<nav id="nav"></nav>
<script src="nav.js"></script>
<h1>Finance Flashcards</h1>
<p class="sub">Tap the card to flip it. Mark the ones you already know.</p>

<button id="card" aria-live="polite"></button>

<div class="btns">
<button id="prev" class="alt">Back</button>
<button id="know">I know this</button>
<button id="next" class="alt">Next</button>
</div>
<div class="btns">
<button id="shuffle" class="alt">Shuffle</button>
<button id="hide" class="alt">Hide known cards</button>
<button id="reset" class="alt">Reset</button>
</div>
<div class="info" id="info"></div>
</main>

<script>
const DATA = [
["NPL", "Non-performing loan. A loan where the borrower has stopped paying on time for a long period, often 90 days or more."],
["CRR", "Cash Reserve Ratio. The share of a bank's deposits that it must keep with the central bank."],
["SLR", "Statutory Liquidity Ratio. The share of deposits a bank must hold in liquid assets, such as cash and government securities."],
["Repo", "Short-term borrowing by a bank from the central bank. The bank sells securities and agrees to buy them back later."],
["Reverse repo", "The opposite of repo. The central bank takes money from banks for a short time and gives securities as cover."],
["FDR", "Fixed Deposit Receipt. A lump sum locked in for a set period at an agreed interest rate."],
["DPS", "Deposit Pension Scheme. You deposit a fixed amount every month and receive a lump sum with interest at the end."],
["EMI", "Equated Monthly Installment. The fixed amount you pay each month to repay a loan with interest."],
["Collateral", "An asset, like land or a deposit, that a borrower pledges so the bank can recover money if the loan is not repaid."],
["Overdraft", "A facility that lets you withdraw more than your account balance, up to an agreed limit, and pay interest on it."],
["Letter of Credit (LC)", "A bank's promise to pay a seller on behalf of a buyer once the agreed documents are presented. Common in trade."],
["KYC", "Know Your Customer. The checks a bank does to verify who a customer is before opening an account."],
["Liquidity", "How quickly an asset can be turned into cash without losing value."],
["Interest spread", "The gap between the rate a bank charges on loans and the rate it pays on deposits."],
["Capital adequacy ratio", "A bank's capital compared with its risky assets. It shows if the bank can absorb losses."],
["Basel III", "International rules that set minimum capital and liquidity standards for banks."],
["Principal", "The original amount borrowed or deposited, before interest."],
["Compound interest", "Interest calculated on the principal plus the interest already earned."],
["Inflation", "A general rise in prices over time, which lowers what each taka can buy."],
["Central bank", "The authority that controls money supply and supervises banks. In Bangladesh, this is Bangladesh Bank."]
];

const $ = id => document.getElementById(id);
let order = DATA.map((_, i) => i);
let pos = 0, flipped = false, hideKnown = false;
const known = new Set();

function visible(){ return order.filter(i => !(hideKnown && known.has(i))); }

function draw(){
  const list = visible();
  const card = $("card");
  card.innerHTML = "";
  if (!list.length) {
    const t = document.createElement("div");
    t.className = "def";
    t.textContent = "You know all the cards! Tap Reset to start again.";
    card.appendChild(t);
    $("info").textContent = "Known: " + known.size + " of " + DATA.length;
    return;
  }
  if (pos >= list.length) pos = 0;
  if (pos < 0) pos = list.length - 1;
  const item = DATA[list[pos]];
  const side = document.createElement("div");
  side.className = "side";
  side.textContent = flipped ? "Meaning" : "Term";
  const body = document.createElement("div");
  body.className = flipped ? "def" : "term";
  body.textContent = flipped ? item[1] : item[0];
  card.appendChild(side);
  card.appendChild(body);
  $("info").textContent = "Card " + (pos + 1) + " of " + list.length + "  ·  Known: " + known.size + " of " + DATA.length +
    (known.has(list[pos]) ? "  ·  This one is marked" : "");
  $("hide").textContent = hideKnown ? "Show known cards" : "Hide known cards";
}

function go(d){ pos += d; flipped = false; draw(); }

$("card").addEventListener("click", () => { flipped = !flipped; draw(); });
$("next").addEventListener("click", () => go(1));
$("prev").addEventListener("click", () => go(-1));
$("know").addEventListener("click", () => {
  const list = visible();
  if (!list.length) return;
  const idx = list[pos];
  if (known.has(idx)) known.delete(idx); else known.add(idx);
  if (hideKnown) { flipped = false; }
  else { pos += 1; flipped = false; }
  draw();
});
$("shuffle").addEventListener("click", () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  pos = 0; flipped = false; draw();
});
$("hide").addEventListener("click", () => { hideKnown = !hideKnown; pos = 0; flipped = false; draw(); });
$("reset").addEventListener("click", () => {
  known.clear(); hideKnown = false; order = DATA.map((_, i) => i); pos = 0; flipped = false; draw();
});

draw();
</script>
</body>
</html>
