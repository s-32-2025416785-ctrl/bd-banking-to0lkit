<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency Converter</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#16261d;--mute:#5d6e63;--line:#d9e2da;--accent:#0b6b4a;--accent-ink:#fff;--warm:#b4461f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a14;--card:#15241b;--ink:#e6efe8;--mute:#93a59a;--line:#264033;--accent:#3fbf8b;--accent-ink:#06150e;--warm:#f08a5d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
label:first-child{margin-top:0}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.err{color:var(--warm);font-weight:600}
footer{color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main>
<nav id="nav"></nav>
<script src="nav.js"></script>
<h1>Currency Converter</h1>
<p class="sub">Convert between taka and another currency using a rate you type in.</p>

<div class="box">
<div class="two">
<div>
<label for="code">Currency code</label>
<input id="code" type="text" value="USD" maxlength="5">
</div>
<div>
<label for="rate">Rate: ৳ for 1 unit</label>
<input id="rate" type="number" inputmode="decimal" value="120" min="0" step="0.01">
</div>
</div>
<label for="fx" id="fxl">Amount in USD</label>
<input id="fx" type="number" inputmode="decimal" value="100" min="0">
<label for="bdt">Amount in taka (৳)</label>
<input id="bdt" type="number" inputmode="decimal" min="0">
</div>

<div class="box" id="tbl" aria-live="polite"></div>

<footer>The rate 120 is only an example. Exchange rates change daily and banks add their own margin, so type in the real rate from your bank or Bangladesh Bank before you rely on the result.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: 2 });

function code(){ return ($("code").value.trim().toUpperCase() || "UNIT"); }
function rate(){ const r = parseFloat($("rate").value); return r > 0 ? r : null; }

function labels(){
  $("fxl").textContent = "Amount in " + code();
}

function table(){
  const t = $("tbl");
  const r = rate();
  if (!r) { t.innerHTML = '<span class="err">Enter a rate above 0.</span>'; return; }
  let h = "<table><tr><th>" + code().replace(/[<>&]/g, "") + "</th><th>Taka</th></tr>";
  [1, 10, 100, 1000].forEach(n => {
    h += "<tr><td>" + n.toLocaleString("en-IN") + "</td><td>৳" + fmt(n * r) + "</td></tr>";
  });
  t.innerHTML = h + "</table>";
}

function fromFx(){
  const r = rate(), v = parseFloat($("fx").value);
  $("bdt").value = (r && v >= 0) ? (v * r).toFixed(2) : "";
}
function fromBdt(){
  const r = rate(), v = parseFloat($("bdt").value);
  $("fx").value = (r && v >= 0) ? (v / r).toFixed(2) : "";
}

$("fx").addEventListener("input", fromFx);
$("bdt").addEventListener("input", fromBdt);
$("rate").addEventListener("input", () => { fromFx(); table(); });
$("code").addEventListener("input", () => { labels(); table(); });

labels(); fromFx(); table();
</script>
</body>
</html>
